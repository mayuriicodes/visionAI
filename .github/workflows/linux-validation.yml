name: Temporary Linux validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13.3"]
    env:
      VISIONAI_JWT_SECRET: "visionai-ci-test-only-secret-not-for-production-2026"
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated runner directories
        env:
          VISIONAI_DATABASE_PATH: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/visionai.sqlite3
          TORCH_HOME: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/torch
          YOLO_CONFIG_DIR: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/yolo-config
        run: |
          mkdir -p \
            "$(dirname "$VISIONAI_DATABASE_PATH")" \
            "$TORCH_HOME" \
            "$YOLO_CONFIG_DIR"

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run backend tests
        env:
          VISIONAI_DATABASE_PATH: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/visionai.sqlite3
          TORCH_HOME: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/torch
          YOLO_CONFIG_DIR: ${{ runner.temp }}/visionai-${{ matrix.python-version }}/yolo-config
        run: python -m unittest discover -s backend/tests -v
