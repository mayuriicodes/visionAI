services:
  - type: web
    name: visionai-api
    runtime: python
    rootDir: .
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Matches the local interpreter; Render deployment compatibility is not yet validated.
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: VISIONAI_COOKIE_SECURE
        value: "true"
      # Set this secret in the Render dashboard; use at least 32 characters.
      - key: VISIONAI_JWT_SECRET
        sync: false
